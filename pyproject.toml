[project]
name = "crafterdojo"
version = "1.0.0"
description = "CrafterDojo: an integrated research suite for building open-ended embodied agents in Crafter (Craftax-Classic)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "attrs>=23.0.0",
    "gym3==0.3.3",
    "huggingface-hub>=0.34.0",
    "hydra-core>=1.3.2",
    "lightning==2.5.1.post0",
    "numpy>=1.26,<2.0",
    "omegaconf>=2.3.0",
    "opencv-python>=4.11.0",
    "peft>=0.15.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "tabulate>=0.10.0",
    "torch==2.9.1",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19.0"]
env = [
    "craftax>=1.4.5",
    "gymnasium>=1.1.0",
    "jax[cuda12]>=0.6.0",
    "pyyaml>=6.0",
]
crafterclip = [
    "dm-tree",
    "einops",
    "kornia>=0.7",
    "open-clip-torch",
    "sentence-transformers",
    "x-transformers==0.27.1",
]
deps = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]
preprocess = [
    "ray>=2.46.0",
    "sentence-transformers",
]
dataset_generation = [
    "chex>=0.1.0",
    "craftax>=1.4.5",
    "distrax>=0.1.5",
    "flax>=0.10.0",
    "jax[cuda12]>=0.6.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.6.0",
    "pyyaml>=6.0",
    "ray>=2.46.0",
    "rich>=13.0.0",
    "wandb>=0.19.0",
]

[project.scripts]
dataset-generation = "dataset_generation.main:main_cli"
expert-train = "dataset_generation.expert_behavior.train:main_cli"
expert-generate = "dataset_generation.expert_behavior.generate:main_cli"
expert-process = "dataset_generation.expert_behavior.process:main_cli"
expert-filter = "dataset_generation.expert_behavior.filter:main_cli"
expert-rank = "dataset_generation.expert_behavior.rank_episodes:main_cli"
caption-generate = "dataset_generation.caption.main:main_cli"
caption-sample = "dataset_generation.caption.sampling:main_cli"
caption-gather = "dataset_generation.caption.gather:main_cli"
extract-embeddings = "crafterdojo.preprocess.embedding:main_cli"
event-bound = "crafterdojo.preprocess.event_bounding:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crafterdojo", "dataset_generation"]

[tool.hatch.build.targets.sdist]
include = [
    "/config",
    "/scripts",
    "/dataset_generation",
    "/src/crafterdojo",
    "/main.py",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
name = "pytorch-cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["ruff>=0.15.9"]
